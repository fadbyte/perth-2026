:root {
    --bg: #f2f2f2;
    --card: #ffffff;
    --ink: #222222;
    --muted: #717171;
    --line: #ebebeb;
    --flight-bg: #eef4fb;
    --flight-line: #dbe6f4;
    --flight-ink: #14487f;
    --flight-ink-soft: #5a7ba3;
    --warn-bg: #fff8e6;
    --warn-line: #f0dca8;
    --warn-ink: #8a6100;
    --ok-bg: #e7f4ec;
    --ok-ink: #1a7a45;
    --no-bg: #fdeaea;
    --no-ink: #c0392b;
    --ink-2: #444444;
    --faint: #999999;
    --field: #f5f5f5;
    --field-line: #dddddd;
    --accent: #222222;
    --on-accent: #ffffff;
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
    color-scheme: light;
  }

  /* Dark palette — applied on explicit choice, or by system when not forced light */
  [data-theme="dark"] {
    --bg: #131517; --card: #1c1f22; --ink: #e9eaeb; --muted: #9aa0a6; --line: #2c3135;
    --flight-bg: #16283c; --flight-line: #24405e; --flight-ink: #7fb2ee; --flight-ink-soft: #92a9c5;
    --warn-bg: #33280f; --warn-line: #574718; --warn-ink: #e6c268;
    --ok-bg: #14311e; --ok-ink: #63c68d; --no-bg: #3a1d1b; --no-ink: #ef857c;
    --ink-2: #c7cacc; --faint: #7f858a; --field: #24282c; --field-line: #343a3f;
    --accent: #e9eaeb; --on-accent: #16181a;
    --shadow: 0 2px 16px rgba(0,0,0,0.45);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]):not([data-theme="dark"]) {
      --bg: #131517; --card: #1c1f22; --ink: #e9eaeb; --muted: #9aa0a6; --line: #2c3135;
      --flight-bg: #16283c; --flight-line: #24405e; --flight-ink: #7fb2ee; --flight-ink-soft: #92a9c5;
      --warn-bg: #33280f; --warn-line: #574718; --warn-ink: #e6c268;
      --ok-bg: #14311e; --ok-ink: #63c68d; --no-bg: #3a1d1b; --no-ink: #ef857c;
      --ink-2: #c7cacc; --faint: #7f858a; --field: #24282c; --field-line: #343a3f;
      --accent: #e9eaeb; --on-accent: #16181a;
      --shadow: 0 2px 16px rgba(0,0,0,0.45);
      color-scheme: dark;
    }
    :root:not([data-theme="light"]):not([data-theme="dark"]) .realmap { filter: brightness(.88) saturate(.9); }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    display: flex;
    justify-content: center;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 20px;
  }

  /* Header */
  .head { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; justify-content: space-between; }
  h1 { font-size: 22px; letter-spacing: -0.3px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .count { text-align: right; line-height: 1.1; }
  .count b { font-size: 30px; font-variant-numeric: tabular-nums; }
  .count span { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .fact { background: var(--field); border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--muted); }
  .fact b { display: block; font-size: 14px; color: var(--ink); font-weight: 600; margin-top: 2px; }

  h2 { font-size: 14px; margin-bottom: 10px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .prop { font-weight: 600; }
  .loc { color: var(--muted); font-size: 12px; }
  .code { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .wrap { overflow-wrap: anywhere; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .shared { background: var(--ok-bg); color: var(--ok-ink); }
  .notshared { background: var(--no-bg); color: var(--no-ink); }
  .dash { color: var(--faint); }

  tr.flight td { background: var(--flight-bg); border-bottom: 1px solid var(--flight-line); }
  tr.flight.top td { border-top: 1px solid var(--flight-line); }
  .fl-main { font-weight: 600; color: var(--flight-ink); }
  .fl-times { display: block; color: var(--flight-ink-soft); font-size: 12px; margin-top: 2px; }
  .plane { margin-right: 6px; }

  .totals { margin-top: 14px; border-top: 2px solid var(--ink); padding-top: 12px; }
  .totrow { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 14px; }
  .totrow.grand { font-size: 16px; font-weight: 700; }
  .totval { font-variant-numeric: tabular-nums; font-weight: 700; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }

  .leg { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .leg:last-child { border-bottom: 0; }
  .leg .route { font-weight: 600; }
  .leg .note { display: block; color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 2px; }
  .leg .time { white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
  .leg .time b { display: block; }
  .leg .time span { color: var(--muted); font-size: 11px; }
  .long .time b { color: var(--no-ink); }

  ul.items { list-style: none; font-size: 13px; }
  ul.items li { padding: 9px 0 9px 22px; border-bottom: 1px solid var(--line); position: relative; }
  ul.items li:last-child { border-bottom: 0; }
  ul.items li::before { content: "○"; position: absolute; left: 4px; top: 8px; color: var(--muted); }
  ul.items li.open::before { content: "●"; color: var(--no-ink); }
  ul.items li b { font-weight: 600; }
  ul.items li span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  .banner { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
  .foot { font-size: 11px; color: var(--faint); line-height: 1.6; padding: 0 4px 4px; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; background: var(--card); border-radius: 999px; padding: 5px; box-shadow: var(--shadow); align-self: flex-start; }
  .tabs button {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--muted);
    background: none; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer;
  }
  .tabs button:focus-visible { outline: 2px solid var(--flight-ink); outline-offset: 2px; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
  .panel { display: flex; flex-direction: column; gap: 14px; }
  .panel[hidden] { display: none; }

  /* Maps */
  .map { width: 100%; height: auto; display: block; }
  .map .land { fill: #eceae4; stroke: #c9c5bb; stroke-linejoin: round; }
  .map .wa { fill: #e3edf7; stroke: #b9cde3; }
  .map .route { fill: none; stroke: var(--flight-ink); stroke-width: 0.6; stroke-dasharray: 2 1.4; stroke-linecap: round; }
  .map .water { fill: none; stroke: #9cc0e0; stroke-linecap: round; }
  .map .coast { fill: none; stroke: #c9c5bb; stroke-linejoin: round; }
  .map .dot { fill: var(--flight-ink); }
  .map .dot.stay { fill: var(--no-ink); }
  .map .lbl { fill: var(--ink); font-family: inherit; font-weight: 600; }
  .map .lbl.soft { fill: var(--muted); font-weight: 400; }
  .stayline .right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .btn {
    display: inline-block; text-decoration: none; font-size: 12px; font-weight: 600;
    color: #fff; background: var(--flight-ink); border-radius: 999px; padding: 7px 14px;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .btn.wide { display: block; text-align: center; padding: 12px; font-size: 13px; }
  .linknote { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }
  .linknote b { color: var(--ink); }
  .card h2 + .linknote { margin-top: -2px; }
  .stayline:last-of-type { border-bottom: 0; }
  .realmap { width: 100%; height: auto; display: block; border-radius: 10px; }
  [data-theme="dark"] .realmap { filter: brightness(.88) saturate(.9); }
  .maplegend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .maplegend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .stayline { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .stayline:last-child { border-bottom: 0; }
  .stayline .where { font-weight: 600; }
  .stayline .where span { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stayline .when { color: var(--muted); white-space: nowrap; }

  /* Small screens: stack the itinerary table into rows */
  @media (max-width: 560px) {
    body { padding: 12px calc(10px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); }
    .card { padding: 16px; border-radius: 14px; }
    h1 { font-size: 20px; }
    .head { flex-wrap: nowrap; }
    .count b { font-size: 26px; }
    .facts .fact { flex: 1 1 calc(50% - 4px); }
    .scroll { overflow-x: visible; }
    table, tbody, tr, td { display: block; width: 100%; }
    thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    tbody tr { padding: 10px 0; border-bottom: 1px solid var(--line); }
    tbody tr:last-child { border-bottom: 0; }
    td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 11px; flex: 0 0 auto; }
    td:first-child { display: block; margin-bottom: 4px; }
    td:first-child::before { content: none; }
    td.num { text-align: right; }
    tr.flight td { background: none; border: 0; }
    tr.flight { background: var(--flight-bg); border-radius: 10px; padding: 10px 12px; margin: 4px 0; border-bottom: 0; }
    tr.flight.top td { border-top: 0; }
    .totrow { padding: 4px 0; }
    .leg, .stayline { flex-wrap: wrap; }
    .stayline .right { width: 100%; justify-content: space-between; margin-top: 6px; }
    .tabs { align-self: stretch; }
    .tabs button { flex: 1; padding: 9px 10px; }
  }

  /* Very narrow phones */
  @media (max-width: 360px) {
    body { padding: 10px; }
    .card { padding: 14px; }
    h1 { font-size: 18px; }
    .facts .fact { flex: 1 1 100%; }
    .count b { font-size: 22px; }
    table, .leg, .stayline, ul.items li { font-size: 12.5px; }
  }

  /* Landscape / unfolded foldables and tablets */
  @media (min-width: 900px) {
    .wrap { max-width: 980px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* Day by day */
  .chiprow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .chip { flex: 0 0 auto; text-decoration: none; font-size: 12px; font-weight: 600; color: var(--flight-ink); background: var(--flight-bg); border-radius: 999px; padding: 6px 12px; }
  .daylist { max-height: 70vh; overflow-y: auto; padding-right: 4px; }
  @media (max-width: 700px) { .daylist { max-height: none; overflow-y: visible; padding-right: 0; } }
  .day { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 10px; }
  .day:last-child { border-bottom: 0; }
  .dcol { display: flex; flex-direction: column; gap: 6px; }
  .ddate { font-weight: 700; font-size: 13px; }
  .dtag { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 3px 8px; text-align: center; background: var(--field); color: var(--muted); }
  .dtag.drive-easy { background: var(--ok-bg); color: var(--ok-ink); }
  .dtag.drive-mid { background: var(--flight-bg); color: var(--flight-ink); }
  .dtag.drive-long { background: var(--no-bg); color: var(--no-ink); }
  .dwhere { font-weight: 600; font-size: 14px; }
  .ddesc { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.5; }
  .dnotes { list-style: none; margin-top: 6px; }
  .dnotes li { font-size: 12px; color: var(--muted); padding-left: 12px; position: relative; line-height: 1.6; }
  .dnotes li::before { content: "·"; position: absolute; left: 3px; }
  .dwx { font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
  table.wxtable td, table.wxtable th { font-size: 13px; }
  .wxnote p { font-size: 13px; line-height: 1.6; color: var(--ink-2); margin-top: 10px; }
  .wxnote p:first-child { margin-top: 14px; }
  @media (max-width: 560px) {
    .day { grid-template-columns: 1fr; gap: 6px; }
    .dcol { flex-direction: row; align-items: center; gap: 8px; }
    .dwx { text-align: left; }
    table.wxtable tbody tr { display: grid; grid-template-columns: 1fr auto; }
    table.wxtable td:first-child { display: block; grid-column: 1 / -1; font-weight: 600; }
  }

  /* Day board — horizontal kanban */
  .dayhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .dayhead h2 { margin-bottom: 0; }
  .arrows { display: flex; gap: 6px; }
  .arrow {
    font: inherit; font-size: 15px; line-height: 1; color: var(--flight-ink); background: var(--flight-bg);
    border: 0; border-radius: 999px; width: 34px; height: 34px; cursor: pointer;
  }
  .arrow:active { background: var(--flight-line); }
  @media (max-width: 560px) { .arrows { display: none; } }

  .daylist {
    display: flex; gap: 12px; max-height: none; overflow-x: auto; overflow-y: visible;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    padding: 2px 2px 12px; margin: 0 -2px;
  }
  .day {
    display: flex; flex-direction: column; gap: 10px;
    flex: 0 0 262px; scroll-snap-align: start;
    background: var(--field); border: 1px solid var(--line); border-top: 4px solid var(--line);
    border-radius: 12px; padding: 14px; border-bottom: 1px solid var(--line);
    scroll-margin-left: 4px;
  }
  .day:last-child { border-bottom: 1px solid var(--line); }
  .day.long { border-top-color: var(--no-ink); }
  .day.easy { border-top-color: var(--ok-ink); }
  .day.mid  { border-top-color: var(--flight-ink); }
  .dcol { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; }
  .dmain { flex: 1; }
  .dwx { text-align: left; font-size: 12px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .dnotes li { font-size: 12px; }
  @media (max-width: 700px) { .daylist { max-height: none; overflow-y: visible; padding-right: 2px; } }
  @media (max-width: 560px) {
    .day { flex: 0 0 82vw; grid-template-columns: none; }
  }

  /* Money tab */
  table.fin td, table.fin th { font-size: 13px; }
  .addrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .addrow input, .addrow select {
    font: inherit; font-size: 13px; padding: 9px 11px; border: 1px solid var(--field-line);
    border-radius: 10px; background: var(--field); color: var(--ink); min-width: 0;
  }
  #exItem { flex: 3 1 180px; }
  #exAmt { flex: 1 1 90px; }
  .addrow select { flex: 1 1 120px; }
  .addrow button {
    font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: var(--flight-ink);
    border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
  }
  .addrow button.ghostbtn { background: var(--field); color: var(--muted); }
  .delrow { background: none; border: 0; color: var(--no-ink); font: inherit; font-size: 16px; cursor: pointer; padding: 0 4px; }
  #tSettle { color: var(--no-ink); }

  /* Settings */
  .segmented { display: flex; gap: 6px; background: var(--field); border-radius: 999px; padding: 5px; }
  .segmented button {
    flex: 1; font: inherit; font-size: 13px; font-weight: 600; color: var(--muted);
    background: none; border: 0; border-radius: 999px; padding: 10px 6px; cursor: pointer;
  }
  .segmented button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .ghostbtn2 {
    font: inherit; font-size: 12px; font-weight: 600; color: var(--no-ink); background: var(--no-bg);
    border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }

  /* Day columns: day card + itinerary card */
  .daycol { flex: 0 0 268px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 10px; scroll-margin-left: 4px; }
  .daycol .day { flex: 1 1 auto; }
  .dtop { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .wx { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .wxi { width: 22px; height: 22px; flex: 0 0 auto; }
  .wx b { font-size: 14px; font-weight: 700; }
  .wx i { font-style: normal; font-size: 12px; color: var(--muted); }
  .dplace { font-size: 11px; color: var(--muted); }
  .dcol { display: flex; align-items: center; gap: 8px; }
  .sug { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .sugh { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .suglist { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .suglist li { font-size: 12px; line-height: 1.45; padding-left: 12px; position: relative; }
  .suglist li::before { content: ""; position: absolute; left: 0; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--flight-ink); }
  .suglist b { display: block; font-weight: 600; font-size: 12.5px; font-style: italic; }
  .suglist span { color: var(--muted); font-style: italic; }
  @media (max-width: 560px) { .daycol { flex: 0 0 84vw; } .day { flex: 0 0 auto; } }

  /* Travellers */
  .tvhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .fam h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .fam h2 span { font-size: 12px; font-weight: 400; color: var(--muted); }
  .person { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .person:last-child { border-bottom: 0; }
  .avatar { flex: 0 0 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; background: var(--flight-bg); color: var(--flight-ink); }
  .avatar.child { background: var(--ok-bg); color: var(--ok-ink); }
  .pname { flex: 1; font-weight: 600; font-size: 14px; }
  .pname span { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .page { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  code { font-size: 12px; background: var(--field); padding: 1px 5px; border-radius: 4px; }

  /* Six tabs: let the bar scroll sideways on narrow screens */
  .tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 0 0 auto; white-space: nowrap; }
  @media (max-width: 560px) { .tabs button { flex: 0 0 auto; padding: 9px 14px; } }

  .tvstatus { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .tvstatus.live::before { content: "● "; color: var(--ok-ink); }
  .tvstatus.offline::before, .tvstatus.fallback::before { content: "● "; color: var(--warn-ink); }
  .ptools { display: flex; gap: 6px; margin-left: 4px; }
  .pbtn { font: inherit; font-size: 12px; font-weight: 600; border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer; background: var(--flight-bg); color: var(--flight-ink); }
  .pbtn.del { background: var(--no-bg); color: var(--no-ink); font-size: 15px; padding: 3px 10px; }
  #tvName { flex: 3 1 150px; } #tvAge { flex: 1 1 70px; } #tvNewFam { flex: 3 1 180px; } #tvNewCode { flex: 1 1 70px; } #tvPass { flex: 3 1 180px; }
  .tvmsg { font-size: 13px; color: var(--no-ink); min-height: 1.2em; }
  .tvmsg.ok { color: var(--ok-ink); }
  [hidden] { display: none !important; }

  /* ===== v1.3 typography: Source Serif 4 (self-hosted, SIL OFL) ===== */
  :root {
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { font-family: var(--serif); font-size: 16px; line-height: 1.6; }
  /* Controls and small labels stay in the phone's own sans for crispness */
  button, input, select, textarea, .tabs, .pill, .dtag, .chip, .code, code, .btn, .fact, th,
  .count span, .maplegend, .avatar, .pbtn, .segmented, .ghostbtn2, .sugh { font-family: var(--sans); }

  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.2; }
  h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.1px; line-height: 1.3; margin-bottom: 12px; }
  .sub { font-size: 15px; }
  .count b { font-size: 32px; font-family: var(--serif); }
  .fact { font-size: 12.5px; }
  .fact b { font-size: 15px; }

  table { font-size: 15px; }
  th { font-size: 11.5px; }
  .loc { font-size: 13.5px; }
  .code { font-size: 12.5px; }
  .fl-times { font-size: 13.5px; }
  .totrow { font-size: 15.5px; }
  .totrow.grand { font-size: 18px; }

  .banner { font-size: 15px; line-height: 1.6; }
  .leg, .stayline, ul.items { font-size: 15px; }
  .leg .note, .stayline .where span, ul.items li span { font-size: 13.5px; line-height: 1.5; }
  .linknote, .wxnote p { font-size: 15px; line-height: 1.6; }
  .foot { font-size: 13px; line-height: 1.6; }

  .daycol { flex: 0 0 292px; }
  .ddate { font-size: 14px; }
  .dwhere { font-size: 17px; }
  .ddesc { font-size: 15px; line-height: 1.55; }
  .dnotes li { font-size: 13.5px; line-height: 1.55; }
  .suglist li { font-size: 13.5px; line-height: 1.5; }
  .suglist b { font-size: 15px; }
  .wx b { font-size: 16px; font-family: var(--serif); }

  .pname { font-size: 16.5px; }
  .pname span { font-size: 13px; font-family: var(--sans); }
  .page { font-size: 14.5px; }
  table.fin td, table.fin th, table.wxtable td, table.wxtable th { font-size: 15px; }
  table.fin th, table.wxtable th { font-size: 11.5px; }

  @media (max-width: 560px) {
    h1 { font-size: 24px; }
    h2 { font-size: 18px; }
    table { font-size: 14.5px; }
    .daycol { flex: 0 0 86vw; }
  }
  @media (max-width: 360px) {
    body { font-size: 15px; }
    h1 { font-size: 22px; }
    table, .leg, .stayline, ul.items li { font-size: 14px; }
  }
  .tvstatus { font-family: var(--sans); font-size: 13px; }
  @media (max-width: 560px) {
    /* Weather: four short columns fit on a phone — keep it a real table */
    table.wxtable { display: table; width: 100%; }
    table.wxtable thead { position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal; display: table-header-group; }
    table.wxtable tbody { display: table-row-group; }
    table.wxtable tr, table.wxtable tbody tr { display: table-row; padding: 0; }
    table.wxtable td, table.wxtable th { display: table-cell; padding: 9px 6px; border-bottom: 1px solid var(--line); }
    table.wxtable td::before { content: none; }
    table.wxtable td:first-child { display: table-cell; margin: 0; font-weight: 600; }
    table.wxtable td:last-child { font-size: 13.5px; color: var(--muted); }
    table.wxtable { table-layout: fixed; }
    table.wxtable td, table.wxtable th { overflow-wrap: normal; word-break: normal; }
    table.wxtable th:nth-child(1) { width: 32%; }
    table.wxtable th:nth-child(2), table.wxtable th:nth-child(3) { width: 17%; }
    table.wxtable th:nth-child(4) { width: 34%; }
    table.wxtable td:first-child { line-height: 1.3; }
    table.wxtable td:last-child { line-height: 1.4; }
  }

  /* ===== v1.3 navigation: top bar, hamburger menu, breadcrumbs ===== */
  body { display: block; padding: 0; }
  .wrap { margin: 0 auto; padding: 6px calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  @media (max-width: 560px) { .wrap { padding: 4px calc(10px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left)); } }
  .tabs { display: none !important; }

  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  .menubtn {
    width: 48px; height: 44px; display: flex; flex-direction: column; justify-content: center; gap: 6px;
    background: none; border: 0; padding: 0 10px; cursor: pointer; border-radius: 10px;
  }
  .menubtn span { display: block; height: 4px; border-radius: 3px; background: var(--ink); transition: transform .2s ease, opacity .2s ease; }
  .menubtn[aria-expanded="true"] span:nth-child(1) { transform: translateY(10px) rotate(45deg); }
  .menubtn[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .menubtn[aria-expanded="true"] span:nth-child(3) { transform: translateY(-10px) rotate(-45deg); }
  .menubtn:focus-visible, .brand:focus-visible { outline: 2px solid var(--flight-ink); outline-offset: 2px; }

  .brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px; color: var(--ink); }
  .brandmark { font-family: var(--sans); font-size: 11px; font-weight: 800; letter-spacing: .5px; color: #fff; background: #14487f; border-radius: 7px; padding: 6px 7px; }
  .brandtext { font-family: var(--serif); font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }

  .mainmenu {
    position: fixed; z-index: 25; left: 0; right: 0; bottom: 0;
    top: var(--topbar-h, 65px);
    background: #2f3133; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 8px calc(28px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(28px + env(safe-area-inset-left));
  }
  .mainmenu ul { list-style: none; max-width: 860px; margin: 0 auto; }
  .mainmenu li { border-bottom: 1px solid rgba(255,255,255,.12); }
  .mainmenu button {
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    font-family: var(--sans); font-size: 16px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: #f2f2f2; padding: 24px 12px;
  }
  .mainmenu button[aria-current="page"] { color: #8fbdf0; }
  .mainmenu button[aria-current="page"]::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #8fbdf0; margin-left: 10px; vertical-align: 3px; }
  .mainmenu button:focus-visible { outline: 2px solid #8fbdf0; outline-offset: -4px; }
  body.menu-open { overflow: hidden; }

  .crumbs { font-family: var(--sans); font-size: 15px; padding: 12px 2px 4px; }
  .crumbs ol { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0; }
  .crumbs li { display: inline-flex; align-items: center; color: var(--flight-ink); }
  .crumbs li + li::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); margin: 0 14px 0 10px; }
  .crumbs button { font: inherit; color: var(--muted); background: none; border: 0; padding: 4px 0; cursor: pointer; }
  .crumbs button:hover { color: var(--ink); }
  .crumbs [aria-current="page"] { color: var(--flight-ink); }

  /* ===== v1.3 overview hero ===== */
  .herotop { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .herotitle { min-width: 0; }
  .herotitle .sub { margin-top: 4px; }
  .countdown { flex: 0 0 auto; min-width: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6px 4px; }
  .countdown b { font-family: var(--serif); font-size: 44px; font-weight: 700; line-height: 1; color: var(--no-ink); letter-spacing: -1px; white-space: nowrap; }
  .countdown span { font-family: var(--sans); font-size: 12.5px; color: var(--ink-2); margin-top: 6px; line-height: 1.3; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; }
  .facts .fact { flex: 1 1 150px; min-width: 0; margin: 0; }
  .facts .fact.wide { flex-basis: 290px; }
  .fact.factlink { position: relative; text-align: left; border: 0; cursor: pointer; color: var(--muted); font: inherit; font-family: var(--sans); font-size: 12.5px; padding-right: 30px; }
  .fact.factlink:hover { filter: brightness(1.05); }
  .fact.factlink:focus-visible { outline: 2px solid var(--flight-ink); outline-offset: 2px; }
  .fact .go { position: absolute; right: 13px; top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: translateY(-50%) rotate(45deg); }
  #costFact { color: var(--ink); }
  @media (max-width: 560px) {
    .countdown { min-width: 84px; }
    .countdown b { font-size: 38px; }
    .facts .fact { flex: 1 1 140px; }
  }
  @media (max-width: 360px) { .facts .fact, .facts .fact.wide { flex-basis: 100%; } }

  /* Booked For pills */
  .pill.who-f { background: var(--flight-bg); color: var(--flight-ink); }
  .pill.who-r { background: var(--warn-bg); color: var(--warn-ink); }
  .pill.who-s { background: var(--ok-bg); color: var(--ok-ink); }

  /* ===== Day by Day: view toggle + calendar ===== */
  .dayhead { flex-wrap: wrap; }
  .viewtoggle { display: inline-flex; background: var(--field); border-radius: 999px; padding: 4px; margin-left: auto; }
  .viewtoggle button { font: inherit; font-family: var(--sans); font-size: 13px; font-weight: 600; border: 0; background: none; color: var(--muted); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .viewtoggle button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .dayhead .arrows { order: 3; }
  .calhead, .calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .calhead { margin: 4px 0 6px; }
  .calhead span { font-family: var(--sans); font-size: 11.5px; font-weight: 600; color: var(--muted); text-align: center; }
  .calcell { position: relative; min-height: 96px; display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: left;
    background: var(--field); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 10px; padding: 7px 7px 8px; font: inherit; color: var(--ink); cursor: pointer; min-width: 0; }
  .calcell.out { background: none; border-color: transparent; cursor: default; opacity: .45; }
  .calcell.k-long { border-top-color: var(--no-ink); } .calcell.k-mid { border-top-color: var(--flight-ink); } .calcell.k-easy { border-top-color: var(--ok-ink); }
  .calcell.sel { outline: 2px solid var(--flight-ink); outline-offset: 1px; }
  .ctop { display: flex; justify-content: space-between; align-items: center; gap: 2px; }
  .cdate { font-family: var(--sans); font-size: 13px; font-weight: 700; }
  .ctop .wxi { width: 20px; height: 20px; }
  .clabel { font-size: 12.5px; line-height: 1.3; overflow-wrap: anywhere; }
  .clabel .lshort { display: none; }

</script></head><body><script>
/* Trip Dashboard engine — renders everything from window.TRIP (trip.js)
   and window.TRIP_CONFIG (config.js). No build step. ES5-safe. */
(function () {
  'use strict';
  var T = window.TRIP;
  if (!T) { document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">trip.js did not load.</p>'; return; }
  var CFG = window.TRIP_CONFIG || {};
  var KEY = function (k) { return T.id + ':' + k; };
  var DAY = 86400000;
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(k, v) { try { v == null ? localStorage.removeItem(KEY(k)) : localStorage.setItem(KEY(k), v); } catch (e) {} }
  function read(k) { try { return localStorage.getItem(KEY(k)); } catch (e) { return null; } }
  function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var start = parseDate(T.start), end = parseDate(T.end);
  var totalDays = Math.round((end - start) / DAY) + 1;
  function dayDate(i) { return new Date(start.getFullYear(), start.getMonth(), start.getDate() + i); }
  function fmtDate(d, withYear) { return d.getDate() + ' ' + MON[d.getMonth()] + (withYear ? ' ' + d.getFullYear() : '') + ' (' + DOW[d.getDay()] + ')'; }

  var CUR = T.currency || { home: 'SGD', homeSym: 'S$', local: 'AUD', localSym: 'A$', rate: 1 };
  var FAM = T.families || [{ code: 'A', name: 'Everyone', short: 'All' }];
  var TWO = FAM.length >= 2;
  var famByCode = {}; FAM.forEach(function (f) { famByCode[f.code] = f; });
  function money(n, cur) { return (cur === CUR.local ? CUR.localSym : CUR.homeSym) + n.toLocaleString('en-SG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  // ---- weather icons
  var ICON = {
    sun: '<svg class="wxi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.6" fill="#f2a33c"/><g stroke="#f2a33c" stroke-width="1.7" stroke-linecap="round"><path d="M12 2.4v2.6M12 19v2.6M2.4 12h2.6M19 12h2.6M5.2 5.2l1.8 1.8M17 17l1.8 1.8M18.8 5.2L17 7M7 17l-1.8 1.8"/></g></svg>',
    part: '<svg class="wxi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="9" r="3.8" fill="#f2a33c"/><g stroke="#f2a33c" stroke-width="1.5" stroke-linecap="round"><path d="M9.5 1.8v1.9M2.3 9h1.9M4.4 3.9l1.4 1.4M14.6 3.9l-1.4 1.4"/></g><path d="M8.6 20.4h8.9a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.5 1.3 2.9 2.9 0 0 0 .2 5.7z" fill="#cfd8e0"/></svg>',
    breeze: '<svg class="wxi" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="8.5" r="3.6" fill="#f2a33c"/><g stroke="#8fb3d1" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M3 14.5h11.2a2.1 2.1 0 1 0-2-2.7M3 18.6h14a2.1 2.1 0 1 1-2 2.7"/></g></svg>',
    cloud: '<svg class="wxi" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 19h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 19z" fill="#b9c4ce"/></svg>',
    rain: '<svg class="wxi" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 15z" fill="#b9c4ce"/><g stroke="#5aa0e0" stroke-width="1.8" stroke-linecap="round"><path d="M8.5 17.5l-1 3M12.5 17.5l-1 3M16.5 17.5l-1 3"/></g></svg>',
    snow: '<svg class="wxi" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14h10.5a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.6A3.3 3.3 0 0 0 7 14z" fill="#c9d3dc"/><g fill="#7fb2ee"><circle cx="8" cy="18" r="1.4"/><circle cx="12.5" cy="20" r="1.4"/><circle cx="17" cy="18" r="1.4"/></g></svg>',
    cold: '<svg class="wxi" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#7fb2ee" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5"/></g></svg>'
  };
  function icon(k) { return ICON[k] || ICON.sun; }
  function wxChip(day) {
    if (!day || (!day.hi && !day.lo)) return '';
    return '<span class="wxchip">' + icon(day.wx) + '<span class="wxtemps"><span class="hl">H</span> <b>' + esc(day.hi || '') + '</b> <span class="wxdot">·</span> <span class="hl">L</span> <span class="wxlo">' + esc(day.lo || '') + '</span></span></span>';
  }
  var pillClass = { S: 'who-s' }; FAM.forEach(function (f, i) { pillClass[f.code] = i === 0 ? 'who-f' : 'who-r'; });
  function whoPill(code, extra) {
    var txt = code === 'S' ? ('Shared' + (extra ? ' ' + extra : '')) : (famByCode[code] ? famByCode[code].name : code);
    return '<span class="pill ' + (pillClass[code] || 'who-s') + '">' + esc(txt) + '</span>';
  }

  /* =====================================================================
     RENDER
     ===================================================================== */
  function renderShell() {
    var h = '<header class="topbar"><button class="brand" data-screen="today" aria-label="' + esc(T.title) + '">' + (T.flag ? '<span class="brandflag">' + T.flag + '</span>' : '') + '<span class="brandtext">' + esc(T.title) + '</span></button>' +
      '<div class="topright">' +
        '<button class="iconbtn" id="fxBtn" aria-label="Exchange rate"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2a2.6 2.6 0 0 0-2.5-1.7c-1.4 0-2.3.8-2.3 1.9 0 2.6 5 1.4 5 4 0 1.2-1 2-2.5 2a2.7 2.7 0 0 1-2.6-1.7M12 6.2v1.3M12 16.5v1.3"/></svg></button>' +
        '<button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5z"/></svg></button>' +
      '</div></header>' +
      '<div class="wrap">' +
        '<section class="screen on" id="screen-today" data-screen="today"><div id="today"></div></section>' +
        '<section class="screen" id="screen-plan" data-screen="plan">' + renderPlan() + '</section>' +
        '<section class="screen" id="screen-money" data-screen="money">' + renderMoney() + '</section>' +
        '<section class="screen" id="screen-trip" data-screen="trip">' +
          '<div class="subnav" role="group" aria-label="Trip sections">' +
          '<button data-sub="travellers" aria-pressed="true">Travellers</button><button data-sub="maps" aria-pressed="false">Maps</button></div>' +
          '<div class="sub on" id="sub-travellers">' + renderTravellers() + '</div>' +
          '<div class="sub" id="sub-maps">' + renderMaps() + '</div>' +
        '</section>' +
      '</div>' +
      '<nav class="bottombar" aria-label="Sections">' +
        tabBtn('today', 'Today', '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>') +
        tabBtn('plan', 'Plan', '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>') +
        tabBtn('money', 'Money', '<rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19"/>') +
        tabBtn('trip', 'Trip', '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M15 6.5a3 3 0 0 1 0 5.8M20.5 20a5 5 0 0 0-4-4.9"/>') +
      '</nav>';
    h += '<dialog class="sheet" id="ideaDialog" aria-labelledby="ideaTitle"><div class="sheethead"><h2 id="ideaTitle">Add</h2><button class="sheetclose" id="ideaClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="form"><input type="hidden" id="ideaKind">' +
      '<label class="fl">What<input id="ideaText" type="text" maxlength="80" placeholder="e.g. Visit Lucky Bay"></label>' +
      '<label class="fl" id="ideaNoteRow">Detail (optional)<input id="ideaNote" type="text" maxlength="120" placeholder="e.g. 50 min from Esperance"></label>' +
      '<label class="fl" id="ideaDayRow">Which day<select id="ideaDay"></select></label>' +
      '<div class="addrow" style="margin-top:14px"><button id="ideaSave">Add</button></div><p class="tvmsg" id="ideaMsg" role="status"></p></div></dialog>';
    h += '<dialog class="sheet" id="fxDialog" aria-labelledby="fxTitle"><div class="sheethead"><h2 id="fxTitle">Exchange Rate</h2><button class="sheetclose" id="fxClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="form"><div class="fxconv"><label class="fl">' + CUR.local + '<div class="fxin"><span>' + CUR.localSym + '</span><input id="fxA" type="number" inputmode="decimal" step="0.01" value="100"></div></label>' +
      '<div class="fxeq">=</div><label class="fl">' + CUR.home + '<div class="fxin"><span>' + CUR.homeSym + '</span><input id="fxB" type="number" inputmode="decimal" step="0.01"></div></label></div>' +
      '<p class="fxrate" id="fxRateLine"></p><p class="foot">Type in either box; the other updates. On the live site the rate refreshes each time the app loads.</p></div></dialog>';
    h += '<dialog class="popup" id="soonDialog"><div class="popupbody"><div class="popupicon">\u2728</div><h3>Coming soon</h3><p>Shared adding for suggestions and notes is on the way. For now the built-in list is read-only.</p><button class="popupok" id="soonOk">Got it</button></div></dialog>';
    document.body.innerHTML = h;
  }
  function tabBtn(id, label, svg) {
    return '<button data-screen="' + id + '"' + (id === 'today' ? ' aria-current="true"' : '') + '><svg viewBox="0 0 24 24" aria-hidden="true">' + svg + '</svg>' + label + '</button>';
  }

  // Plan = the day board/calendar + the full bookings timeline + weather.
  function renderPlan() {
    var rows = (T.bookings || []).map(function (b, i, all) {
      var first = b.kind === 'flight' && (i === 0 || all[i - 1].kind !== 'flight');
      var name = b.kind === 'flight'
        ? '<span class="plane">✈</span><span class="fl-main">' + esc(b.title) + '</span><span class="fl-times">' + esc(b.sub) + '</span>'
        : '<span class="prop">' + esc(b.title) + '</span><br><span class="loc">' + esc(b.sub) + (b.url ? ' · <a href="' + esc(b.url) + '" target="_blank" rel="noopener">Airbnb ↗</a>' : '') + '</span>';
      return '<tr class="' + (b.kind === 'flight' ? 'flight' + (first ? ' top' : '') : '') + '"><td data-label="Property / flight">' + name + '</td>' +
        '<td data-label="Dates">' + esc(b.dates) + '</td>' +
        '<td class="num' + (b.cost == null ? ' dash' : '') + '" data-label="Cost (' + CUR.home + ')">' + (b.cost == null ? '—' : money(b.cost, CUR.home)) + '</td>' +
        '<td class="code" data-label="Code / ref">' + esc(b.ref || '—') + '</td>' +
        '<td data-label="Booked For">' + (b.who ? whoPill(b.who) : '<span class="dash">—</span>') + '</td></tr>';
    }).join('');
    var stays = (T.bookings || []).filter(function (b) { return b.kind === 'stay'; });
    var shared = stays.filter(function (b) { return b.who === 'S'; });
    var sharedTot = 0, grand = 0; stays.forEach(function (b) { if (b.cost != null) { grand += b.cost; if (b.who === 'S') sharedTot += b.cost; } });
    var legs = (T.legs || []).map(function (l) {
      return '<div class="leg ' + (l.kind === 'long' ? 'long' : '') + '"><span class="route">' + esc(l.route) + '<span class="note">' + esc(l.note) + '</span></span><span class="time"><b>' + esc(l.time) + '</b><span>' + esc(l.dist) + '</span></span></div>';
    }).join('');
    var todo = (T.todo || []).map(function (t) { return '<li' + (t.open ? ' class="open"' : '') + '><b>' + esc(t.title) + '</b><span>' + esc(t.note) + '</span></li>'; }).join('');
    var timeline = '<div class="card"><h2>' + esc(T.bookingsTitle || 'Flights and Stays') + '</h2><div class="scroll"><table><thead><tr><th>Property / flight</th><th>Dates</th><th class="num">Cost (' + CUR.home + ')</th><th>Code / ref</th><th>Booked For</th></tr></thead><tbody>' + rows + '</tbody></table></div>' + (T.bookingsNote ? '<p class="booknote">' + T.bookingsNote + '</p>' : '') +
      '<div class="totals">' + (TWO ? '<div class="totrow"><span>Shared total (' + shared.length + ' properties)</span><span class="totval">' + money(sharedTot, CUR.home) + '</span></div>' : '') +
      '<div class="totrow grand"><span>Grand total (' + stays.filter(function (b) { return b.cost != null; }).length + ' priced stays)</span><span class="totval">' + money(grand, CUR.home) + '</span></div></div></div>';
    var side = (legs ? '<div class="card"><h2>' + esc(T.legsTitle || 'Drive Legs') + '</h2>' + legs + (T.legsFoot ? '<p class="foot" style="margin-top:10px">' + esc(T.legsFoot) + '</p>' : '') + '</div>' : '') +
      '<div class="card"><h2>Still to Sort</h2><ul class="items">' + todo + '</ul></div>';
    return renderDays() + timeline + '<div class="cols">' + side + '</div>' + (T.overviewFoot ? '<p class="foot">' + esc(T.overviewFoot) + '</p>' : '');
  }

  function renderOverview() {
    var stays = (T.bookings || []).filter(function (b) { return b.kind === 'stay'; });
    var shared = stays.filter(function (b) { return b.who === 'S'; });
    var nights = totalDays - 1;
    var tiles = (T.tiles || []).map(function (t) {
      var val = t.value || '';
      if (t.dyn === 'duration') val = totalDays + ' days · ' + nights + ' nights';
      if (t.dyn === 'stays') val = stays.length + ' stays · ' + shared.length + ' shared, ' + (stays.length - shared.length) + ' individual';
      var id = t.dyn === 'travellers' ? ' id="tvFact"' : t.dyn === 'cost' ? ' id="costFact"' : t.dyn === 'vehicles' ? ' id="carFact"' : '';
      if (t.go) return '<button class="fact factlink" data-go="' + t.go + '"' + (t.costfilter ? ' data-costfilter="' + t.costfilter + '"' : '') + '>' + esc(t.label) + '<b' + id + '>' + esc(val) + '</b><i class="go" aria-hidden="true"></i></button>';
      return '<div class="fact">' + esc(t.label) + '<b' + id + '>' + esc(val) + '</b></div>';
    }).join('');
    var rows = (T.bookings || []).map(function (b, i, all) {
      var first = b.kind === 'flight' && (i === 0 || all[i - 1].kind !== 'flight');
      var name = b.kind === 'flight'
        ? '<span class="plane">✈</span><span class="fl-main">' + esc(b.title) + '</span><span class="fl-times">' + esc(b.sub) + '</span>'
        : '<span class="prop">' + esc(b.title) + '</span><br><span class="loc">' + esc(b.sub) + (b.url ? ' · <a href="' + esc(b.url) + '" target="_blank" rel="noopener">Airbnb ↗</a>' : '') + '</span>';
      return '<tr class="' + (b.kind === 'flight' ? 'flight' + (first ? ' top' : '') : '') + '"><td data-label="Property / flight">' + name + '</td>' +
        '<td data-label="Dates">' + esc(b.dates) + '</td>' +
        '<td class="num' + (b.cost == null ? ' dash' : '') + '" data-label="Cost (' + CUR.home + ')">' + (b.cost == null ? '—' : money(b.cost, CUR.home)) + '</td>' +
        '<td class="code" data-label="Code / ref">' + esc(b.ref || '—') + '</td>' +
        '<td data-label="Booked For">' + (b.who ? whoPill(b.who) : '<span class="dash">—</span>') + '</td></tr>';
    }).join('');
    var sharedTot = 0, grand = 0; stays.forEach(function (b) { if (b.cost != null) { grand += b.cost; if (b.who === 'S') sharedTot += b.cost; } });
    var legs = (T.legs || []).map(function (l) {
      return '<div class="leg ' + (l.kind === 'long' ? 'long' : '') + '"><span class="route">' + esc(l.route) + '<span class="note">' + esc(l.note) + '</span></span><span class="time"><b>' + esc(l.time) + '</b><span>' + esc(l.dist) + '</span></span></div>';
    }).join('');
    var todo = (T.todo || []).map(function (t) { return '<li' + (t.open ? ' class="open"' : '') + '><b>' + esc(t.title) + '</b><span>' + esc(t.note) + '</span></li>'; }).join('');

      '<div class="facts">' + tiles + '</div></div>' +
      (T.banner ? '<div class="banner">' + T.banner + '</div>' : '') +
      '<div class="card"><h2>' + esc(T.bookingsTitle || 'Flights and Stays') + '</h2><div class="scroll"><table><thead><tr><th>Property / flight</th><th>Dates</th><th class="num">Cost (' + CUR.home + ')</th><th>Code / ref</th><th>Booked For</th></tr></thead><tbody>' + rows + '</tbody></table></div>' + (T.bookingsNote ? '<p class="booknote">' + T.bookingsNote + '</p>' : '') +
      '<div class="totals">' + (TWO ? '<div class="totrow"><span>Shared total (' + shared.length + ' properties)</span><span class="totval">' + money(sharedTot, CUR.home) + '</span></div>' : '') +
      '<div class="totrow grand"><span>Grand total (' + stays.filter(function(b){return b.cost!=null;}).length + ' priced stays)</span><span class="totval">' + money(grand, CUR.home) + '</span></div></div></div>' +
      '<div class="cols">' + (legs ? '<div class="card"><h2>' + esc(T.legsTitle || 'Drive Legs') + '</h2>' + legs + (T.legsFoot ? '<p class="foot" style="margin-top:10px">' + esc(T.legsFoot) + '</p>' : '') + '</div>' : '') +
      '<div class="card"><h2>Still to Sort</h2><ul class="items">' + todo + '</ul></div></div>' +
      (T.overviewFoot ? '<p class="foot">' + esc(T.overviewFoot) + '</p>' : '') +
      '</div>';
  }

  function renderTravellers() {
    return '<div class="panel" id="panel-travellers">' +
      '<div class="card"><div class="tvhead"><div><h2 style="margin-bottom:2px">Who\'s Coming</h2><p class="sub" id="tvLine"></p></div><div class="count"><b id="tvTotal">—</b><span>travellers</span></div></div>' +

      var dt = dayDate(k);
      out += '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + DOW[dt.getDay()] + ' ' + dt.getDate() + ' ' + MON[dt.getMonth()] + ' · ' + esc(T.days[k].place || T.days[k].where) + '</option>';

  }
  // best-guess day for an idea by matching its text to a day's place (Option C default)
  function guessDay(text) {
    var t = (text || '').toLowerCase(), restMatch = null, anyMatch = null;
    for (var k = 0; k < (T.days || []).length; k++) {
      var place = (T.days[k].place || '').toLowerCase();
      if (place && t.indexOf(place.split(' ')[0]) >= 0) {
        if (anyMatch == null) anyMatch = k;
        if (restMatch == null && (T.days[k].kind || 'rest') === 'rest') restMatch = k; // prefer a full/rest day over a travel day
      }
    }
    return restMatch != null ? restMatch : anyMatch;
  }

        .catch(function (e) { busy = false; if (/passcode/i.test(e.message)) { setPass(''); draw(); msg('The passcode has changed — enter the new one.'); } else msg('Couldn’t save: ' + e.message); });
    }
    function remove(id) { var r = rows.filter(function (x) { return x.id === id; })[0]; if (!r || !confirm('Remove ' + r.name + ' from the trip?')) return;
      rpc('delete_traveller', { p_passcode: getPass(), p_trip: T.id, p_id: id }).then(function () { if (editingId === id) editingId = null; return load(); }).then(function () { msg(r.name + ' removed.', true); }).catch(function (e) { msg('Couldn’t remove: ' + e.message); }); }
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t.id === 'tvUnlock') { var v = ($('tvPass').value || '').trim(); if (!v) return msg('Enter the passcode.'); msg('Checking…', true);
        rpc('check_passcode', { p: v, p_trip: T.id }).then(function (ok) { if (ok === true) { setPass(v); draw(); msg('Unlocked on this phone.', true); } else msg('That passcode isn’t right.'); }).catch(function () { msg('Couldn’t check the passcode — are you online?'); }); }
      else if (t.id === 'tvSave') save(); else if (t.id === 'tvCancel') { editingId = null; draw(); } else if (t.id === 'tvLock') { setPass(''); editingId = null; draw(); }
      else if (t.getAttribute && t.getAttribute('data-edit')) { editingId = parseInt(t.getAttribute('data-edit'), 10); draw(); $('tvEdit').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      else if (t.getAttribute && t.getAttribute('data-del')) remove(parseInt(t.getAttribute('data-del'), 10));
    });
    document.addEventListener('change', function (e) { if (e.target.id === 'tvFam') { var row = $('tvNewFamRow'); if (row) row.hidden = e.target.value !== '__new'; } });
    document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'tvPass') $('tvUnlock').click(); });
    var tvTab = document.querySelector('[data-screen="trip"]'); if (tvTab) tvTab.addEventListener('click', function () { load(); });
    rows = flatten(FALLBACK); draw(); load();
  }

  function costs() {
    var C = T.costs || {}, cats = {}; (C.categories || [['flight', 'Flight'], ['stay', 'Accommodation'], ['car', 'Car Hire'], ['transport', 'Transport'], ['food', 'Food & Groceries'], ['shop', 'Shopping'], ['other', 'Others']]).forEach(function (c) { cats[c[0]] = c[1]; });
    var A = FAM[0].code, B = TWO ? FAM[1].code : null;
    var state, filter = 'all', editing = null, who = TWO ? 'S' : A, paid = A;
    function load() { try { state = JSON.parse(read('costs') || 'null'); } catch (e) { state = null; } if (!state || !state.items) state = { items: (C.seed || []).map(function (x) { return Object.assign({}, x); }), rate: CUR.rate }; }
    function save() { store('costs', JSON.stringify(state)); }
    function sgd(x) { return x.amt == null ? null : (x.cur === CUR.local ? x.amt * state.rate : x.amt); }
    function shares(x) { var v = sgd(x); if (v == null) return null; var f = x.who === A ? 100 : x.who === B ? 0 : x.f; return { A: v * f / 100, B: v * (100 - f) / 100, f: f }; }
    function whoTxt(x) { return x.who === 'S' ? 'Shared ' + x.f + '/' + (100 - x.f) : (famByCode[x.who] || {}).name || x.who; }
    function draw() {
      var items = state.items.filter(function (x) { return filter === 'all' || x.cat === filter; });
      var tot = 0, tA = 0, tB = 0, owe = 0, missing = 0, sharedN = 0, sharedT = 0;
      var rows = items.map(function (x) {
        var sh = shares(x), v = sgd(x);
        if (sh) { tot += v; tA += sh.A; tB += sh.B; owe += (x.paid === A ? sh.B : -sh.A); if (x.who === 'S') { sharedN++; sharedT += v; } } else missing++;
        var cost = x.amt == null ? '<span class="none">not recorded</span>' : money(x.amt, x.cur) + (x.cur === CUR.local ? '<small>≈ ' + money(v, CUR.home) + '</small>' : '');
        var meta = [x.note, cats[x.cat], TWO ? 'Paid by ' + ((famByCode[x.paid] || {}).short || x.paid) : ''].filter(Boolean).join(' · ');
        return '<tr class="crow" data-cedit="' + x.id + '" tabindex="0" role="button" aria-label="Edit ' + esc(x.name) + '"><td data-label="Item"><span class="cname">' + esc(x.name) + '</span><small class="cmeta">' + esc(meta) + '</small></td><td class="num" data-label="Cost">' + cost + '</td>' +
          (TWO ? '<td data-label="For">' + whoPill(x.who, x.who === 'S' ? x.f + '/' + (100 - x.f) : '') + '</td><td class="num" data-label="' + esc(FAM[0].name) + '">' + (sh && sh.A > 0.004 ? money(sh.A, CUR.home) : '<span class="dash">—</span>') + '</td><td class="num" data-label="' + esc(FAM[1].name) + '">' + (sh && sh.B > 0.004 ? money(sh.B, CUR.home) : '<span class="dash">—</span>') + '</td>' : '') + '</tr>';
      }).join('');
      $('costList').innerHTML = items.length ? '<div class="scroll"><table class="fin costtab"><thead><tr><th>Item</th><th class="num">Cost</th>' + (TWO ? '<th>For</th><th class="num">' + esc(FAM[0].name) + '</th><th class="num">' + esc(FAM[1].name) + '</th>' : '') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="foot">Nothing in this category yet.</p>';
      var label = owe > 0.005 ? FAM[1].name + ' owes ' + FAM[0].name : owe < -0.005 ? FAM[0].name + ' owes ' + FAM[1].name : 'Settled up';
      $('costTotals').innerHTML = (TWO ? (sharedN ? '<div class="totrow"><span>Shared items (' + sharedN + ')</span><span class="totval">' + money(sharedT, CUR.home) + '</span></div>' : '') +
        '<div class="totrow"><span>' + esc(FAM[0].name) + ' total</span><span class="totval">' + money(tA, CUR.home) + '</span></div><div class="totrow"><span>' + esc(FAM[1].name) + ' total</span><span class="totval">' + money(tB, CUR.home) + '</span></div>' +
        '<div class="totrow owe"><span>' + esc(label) + '</span><span class="totval">' + money(Math.abs(owe), CUR.home) + '</span></div>' : '') +
        '<div class="totrow grand"><span>' + (filter === 'all' ? 'All items' : esc(cats[filter])) + ' (' + items.length + ')</span><span class="totval">' + money(tot, CUR.home) + '</span></div>';
      $('costNote').textContent = (missing ? missing + (missing === 1 ? ' item has' : ' items have') + ' no cost yet and ' + (missing === 1 ? 'is' : 'are') + ' not in the totals. ' : '') + 'Tap an item to edit it' + (TWO ? ' or change its split' : '') + '. Totals in ' + CUR.home + '. Saved on this phone only until shared sync is switched on.';
      var all = 0; state.items.forEach(function (x) { var v = sgd(x); if (v != null) all += v; });
      if ($('costFact')) $('costFact').textContent = money(all, CUR.home);
      var cars = state.items.filter(function (x) { return x.cat === 'car'; }), carT = 0; cars.forEach(function (x) { var v = sgd(x); if (v != null) carT += v; });
      if ($('carFact')) $('carFact').textContent = cars.length ? cars.length + ' booked · ' + money(carT, CUR.home) : ((T.tiles || []).filter(function (t) { return t.dyn === 'vehicles'; })[0] || {}).value || 'Not booked';
      Array.prototype.forEach.call(document.querySelectorAll('#costFilters [data-cat]'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-cat') === filter ? 'true' : 'false'); });
    }
    function segSet(id, v) { var el = $(id); if (!el) return; Array.prototype.forEach.call(el.querySelectorAll('[data-v]'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === v ? 'true' : 'false'); }); }
    function splitUI() {
      if (!TWO) return; $('ceSplit').hidden = who !== 'S';
      var f = +$('ceRange').value, amt = parseFloat($('ceAmt').value), cur = $('ceCur').value;
      $('spF').textContent = f + '%'; $('spR').textContent = (100 - f) + '%'; $('spFa').textContent = amt > 0 ? money(amt * f / 100, cur) : ''; $('spRa').textContent = amt > 0 ? money(amt * (100 - f) / 100, cur) : '';
      $('ceRange').style.setProperty('--f', f + '%');
      Array.prototype.forEach.call($('ceSplit').querySelectorAll('[data-p]'), function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-p') === f ? 'true' : 'false'); });
    }
    function resetForm() { editing = null; $('ceTitle').textContent = 'Add an Item'; $('ceSave').textContent = 'Add Item'; $('ceDelete').hidden = true; $('ceName').value = ''; $('ceAmt').value = ''; $('ceCur').value = CUR.local; $('ceCat').value = C.defaultCategory || 'food'; who = TWO ? 'S' : A; paid = A; if (TWO) { $('ceRange').value = 50; segSet('ceFor', who); segSet('cePaid', paid); } splitUI(); $('ceMsg').textContent = ''; }
    function openSheet() { var d = $('costDialog'); if (!d.open) { if (d.showModal) d.showModal(); else d.setAttribute('open', ''); } document.body.classList.add('sheet-open'); setTimeout(function () { if (!editing) $('ceName').focus(); }, 60); }
    function closeSheet() { var d = $('costDialog'); if (d.open) { if (d.close) d.close(); else d.removeAttribute('open'); } document.body.classList.remove('sheet-open'); }
    function toast(t) { var el = $('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('show'); }, 2200); }
    function edit(id) { var x = state.items.filter(function (i) { return i.id === id; })[0]; if (!x) return; editing = id; $('ceTitle').textContent = 'Edit Item'; $('ceSave').textContent = 'Save Changes'; $('ceDelete').hidden = false;
      $('ceName').value = x.name; $('ceAmt').value = x.amt == null ? '' : x.amt; $('ceCur').value = x.cur; $('ceCat').value = x.cat; who = x.who; paid = x.paid; if (TWO) { $('ceRange').value = x.who === 'S' ? Math.round(x.f / 5) * 5 : 50; segSet('ceFor', who); segSet('cePaid', paid); } splitUI(); openSheet(); }
    function submit() {
      var name = $('ceName').value.trim(), raw = $('ceAmt').value.trim(), amt = raw === '' ? null : parseFloat(raw);
      if (!name) { $('ceMsg').className = 'tvmsg'; $('ceMsg').textContent = 'Give the item a name.'; return; }
      if (raw !== '' && !(amt >= 0)) { $('ceMsg').className = 'tvmsg'; $('ceMsg').textContent = 'Amount must be a number.'; return; }
      var rec = { name: name, amt: amt, cur: $('ceCur').value, cat: $('ceCat').value, who: who, f: who === 'S' ? +$('ceRange').value : (who === A ? 100 : 0), paid: paid };
      if (editing) state.items = state.items.map(function (x) { return x.id === editing ? Object.assign(x, rec) : x; }); else { rec.id = 'c' + Date.now(); state.items.push(rec); }
      var wasEdit = !!editing; save(); draw(); closeSheet(); resetForm(); toast(wasEdit ? 'Saved' : name + ' added');
    }
    document.addEventListener('click', function (e) {
      var t = e.target, c;
      if ((c = t.closest('#costFilters [data-cat]'))) { filter = c.getAttribute('data-cat'); draw(); return; }
      if ((c = t.closest('[data-costfilter]'))) { filter = c.getAttribute('data-costfilter'); draw(); return; }
      if ((c = t.closest('#ceFor [data-v]'))) { who = c.getAttribute('data-v'); segSet('ceFor', who); splitUI(); return; }
      if ((c = t.closest('#cePaid [data-v]'))) { paid = c.getAttribute('data-v'); segSet('cePaid', paid); return; }
      if ((c = t.closest('#ceSplit [data-p]'))) { $('ceRange').value = c.getAttribute('data-p'); splitUI(); return; }
      if ((c = t.closest('#ceSplit [data-swap]'))) { $('ceRange').value = 100 - +$('ceRange').value; splitUI(); return; }
      if ((c = t.closest('[data-cedit]'))) { edit(c.getAttribute('data-cedit')); return; }
      if (t.closest('#costAdd')) { resetForm(); openSheet(); return; }
      if (t.closest('#ceClose') || t.id === 'costDialog') { closeSheet(); resetForm(); return; }
      if (t.id === 'ceSave') submit();
      if (t.id === 'ceDelete' && editing) { var gone = state.items.filter(function (i) { return i.id === editing; })[0]; if (gone && confirm('Delete ' + gone.name + '?')) { state.items = state.items.filter(function (i) { return i.id !== editing; }); save(); closeSheet(); resetForm(); draw(); toast(gone.name + ' deleted'); } }
      if (t.id === 'ceCopy') { var lines = state.items.map(function (x) { var v = sgd(x); return x.name + ' — ' + (v == null ? 'no cost yet' : money(v, CUR.home)) + (TWO ? ' (' + whoTxt(x) + ')' : ''); }); var owe = document.querySelector('#costTotals .owe'); if (owe) lines.push(owe.textContent.replace(/(\D)(\S\$)/, '$1: $2')); try { navigator.clipboard.writeText(lines.join('\n')); t.textContent = 'Copied'; setTimeout(function () { t.textContent = 'Copy summary'; }, 1500); } catch (err) {} }
    });
    $('costList').addEventListener('keydown', function (e) { var r = e.target.closest && e.target.closest('[data-cedit]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); edit(r.getAttribute('data-cedit')); } });
    ['ceRange', 'ceAmt', 'ceCur'].forEach(function (id) { if ($(id)) $(id).addEventListener('input', splitUI); });
    $('ceRate').addEventListener('change', function () { var r = parseFloat(this.value); if (r > 0) { state.rate = r; save(); draw(); splitUI(); } else this.value = state.rate; });
    $('costDialog').addEventListener('close', function () { document.body.classList.remove('sheet-open'); });
    load(); $('ceRate').value = state.rate; resetForm(); draw();
  }

  function serviceWorker() {
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }

  // ---- boot
  try { var th = read('theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
  document.title = T.title + (T.dateLabel ? ' — ' + T.dateLabel : '');
  renderShell();
  renderToday(); screens(); theme(); board(); calendar(); travellers(); costs(); serviceWorker();
  (function fetchFX() {
    if (location.protocol.indexOf('http') !== 0) return;
    fetch('https://open.er-api.com/v6/latest/' + CUR.local, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.rates && j.rates[CUR.home]) { window.__FXRATE__ = j.rates[CUR.home]; renderToday(); } })
      .catch(function () { /* keep seeded CUR.rate */ });
  })();
})();

</script></body></html>
